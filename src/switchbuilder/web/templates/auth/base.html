<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
{% include "_theme_head.html" %}
<title>{% block title %}Multi-Vendor Switch Config Builder{% endblock %}</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
       font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 1000px; margin: 0 auto; padding: 24px 16px 48px; }
main.narrow { max-width: 420px; padding-top: 10vh; }
h1 { font-size: 22px; margin: 0 0 16px; }
h2 { font-size: 17px; margin: 0 0 12px; }
.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 18px; }
label { display: block; font-weight: 600; margin-bottom: 4px; }
.hint { color: var(--muted); font-size: 13px; font-weight: 400; }
input[type=text], input[type=password], select {
  width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 6px;
  background: var(--bg); color: var(--text); font: inherit; }
.field { margin-bottom: 14px; }
button { border: 1px solid var(--accent); background: var(--accent); color: var(--accent-text);
  padding: 8px 14px; border-radius: 6px; font: inherit; font-weight: 600; cursor: pointer; }
button.secondary { background: transparent; color: var(--accent); }
button.danger { background: transparent; border-color: var(--bad); color: var(--bad); }
button.small { padding: 4px 10px; font-size: 13px; }
a.btn { display: inline-block; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-text);
  padding: 8px 14px; border-radius: 6px; font-weight: 600; text-decoration: none; }
a.btn.secondary { background: transparent; color: var(--accent); }
a.btn.small { padding: 4px 10px; font-size: 13px; }
button:disabled { opacity: .5; cursor: not-allowed; }
.row { display: grid; grid-template-columns: 2fr 2fr 1fr auto; gap: 10px; align-items: end; }
@media (max-width: 700px) { .row { grid-template-columns: 1fr; } }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.scroll { overflow-x: auto; }
.inline { display: inline-flex; gap: 6px; align-items: center; margin: 2px 0; }
.inline select, .inline input { width: auto; padding: 4px 6px; font-size: 13px; }
.badge { white-space: nowrap; display: inline-block; margin: 1px 0; font-size: 12px; padding: 2px 8px; border-radius: 10px; border: 1px solid var(--border); }
.badge.off { color: var(--bad); border-color: var(--bad); }
.badge.on { color: var(--ok); border-color: var(--ok); }
.muted { color: var(--muted); }
</style>
</head>
<body>
<main class="{% block main_class %}{% endblock %}">
{% include "auth/_nav.html" %}
{% block content %}{% endblock %}
</main>
{% if not current_user %}<div class="theme-float">{% include "_theme_toggle.html" %}</div>{% endif %}
</body>
</html>
