<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --text: #1d2430; --muted: #5b6676; --border: #d9dee6;
  --accent: #2f6fdf; --accent-text: #ffffff; --ok: #1f7a4d; --warn: #9a6200; --bad: #b42318;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12151a; --panel: #1b2028; --text: #e4e8ee; --muted: #9aa5b4; --border: #2d3440;
    --accent: #5b8ff0; --accent-text: #0b0e12; --ok: #5cc48f; --warn: #e3a944; --bad: #f07a70;
  }
}
.fw-nav { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 18px;
  padding-bottom: 12px; border-bottom: 1px solid var(--border); font-size: 14px; }
.fw-nav .brand { font-weight: 700; color: var(--text); text-decoration: none; margin-right: auto; }
.fw-nav a { color: var(--accent); text-decoration: none; }
.fw-nav .who { color: var(--muted); }
.fw-nav form { margin: 0; }
.fw-nav .client-pick { display: inline-flex; align-items: center; gap: 6px; }
.fw-nav .client-pick label { margin: 0; font-weight: 600; color: var(--muted); font-size: 13px; }
.fw-nav .client-pick select { width: auto; max-width: 220px; padding: 4px 8px; font: inherit; font-weight: 600;
  border: 1px solid var(--accent); border-radius: 6px; background: var(--panel); color: var(--text); }
.fw-nav button.link { background: none; border: 0; color: var(--accent); padding: 0; font: inherit; cursor: pointer; }
.flash { padding: 10px 14px; border-radius: 6px; margin-bottom: 14px; border: 1px solid var(--border); }
.flash.error { border-color: var(--bad); color: var(--bad); }
.flash.ok { border-color: var(--ok); color: var(--ok); }
.flash.info { border-color: var(--accent); }
</style>
