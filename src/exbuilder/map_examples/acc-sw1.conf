system {
    host-name acc-sw1;
}
interfaces {
    xe-0/1/0 {
        ether-options {
            802.3ad ae0;
        }
    }
    xe-0/1/1 {
        ether-options {
            802.3ad ae0;
        }
    }
    ae0 {
        mtu 9216;
        aggregated-ether-options {
            lacp {
                active;
            }
        }
        native-vlan-id 10;
        unit 0 {
            family ethernet-switching {
                interface-mode trunk;
                vlan {
                    members [ USERS VOICE MGMT ];
                }
            }
        }
    }
    irb {
        unit 10 {
            family inet {
                address 10.10.10.2/24;
            }
        }
    }
}
vlans {
    MGMT {
        vlan-id 10;
        l3-interface irb.10;
    }
    USERS {
        vlan-id 20;
    }
    VOICE {
        vlan-id 30;
    }
}

Local Interface    Parent Interface    Chassis Id          Port info          System Name
xe-0/1/0           ae0                 2c:6b:f5:aa:00:01   xe-0/1/0           core-sw1
xe-0/1/1           ae0                 2c:6b:f5:aa:00:01   xe-0/1/1           core-sw1
