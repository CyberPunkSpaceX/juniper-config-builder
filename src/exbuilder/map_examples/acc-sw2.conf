set system host-name acc-sw2
set interfaces xe-0/1/0 description "uplink core-sw1"
set interfaces xe-0/1/0 unit 0 family ethernet-switching interface-mode trunk
set interfaces xe-0/1/0 unit 0 family ethernet-switching vlan members USERS
set interfaces xe-0/1/0 unit 0 family ethernet-switching vlan members MGMT
set interfaces ge-0/0/47 unit 0 family inet address 10.255.255.1/31
set interfaces irb unit 10 family inet address 10.10.10.2/24
set vlans MGMT vlan-id 10
set vlans MGMT l3-interface irb.10
set vlans STAFF vlan-id 20
set protocols rstp bridge-priority 32k
