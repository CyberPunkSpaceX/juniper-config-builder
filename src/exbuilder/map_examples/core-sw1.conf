set version 23.4R2
set system host-name core-sw1
set chassis aggregated-devices ethernet device-count 2
set interfaces xe-0/1/0 description "acc-sw1 uplink"
set interfaces xe-0/1/0 ether-options 802.3ad ae0
set interfaces xe-0/1/1 ether-options 802.3ad ae0
set interfaces ae0 aggregated-ether-options lacp active
set interfaces ae0 unit 0 family ethernet-switching interface-mode trunk
set interfaces ae0 unit 0 family ethernet-switching vlan members [ USERS VOICE MGMT ]
set interfaces ae0 native-vlan-id 10
set interfaces ae0 mtu 9216
set interfaces xe-0/1/2 description "to acc-sw2 xe-0/1/0"
set interfaces xe-0/1/2 unit 0 family ethernet-switching interface-mode trunk
set interfaces xe-0/1/2 unit 0 family ethernet-switching vlan members [ USERS VOICE MGMT ]
set interfaces ge-0/0/0 description "p2p acc-sw2"
set interfaces ge-0/0/0 unit 0 family inet address 10.255.255.0/31
set interfaces irb unit 10 family inet address 10.10.10.1/24
set interfaces me0 unit 0 family inet address 192.168.1.10/24
set vlans MGMT vlan-id 10
set vlans MGMT l3-interface irb.10
set vlans USERS vlan-id 20
set vlans VOICE vlan-id 30
set protocols rstp bridge-priority 4k
