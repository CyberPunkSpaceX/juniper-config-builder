[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "juniper-config-builder"
version = "0.1.0"
description = "Web GUI and CLI that build Juniper EX switch configuration (Junos ELS)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
web = ["flask>=3.0", "gunicorn>=22", "segno>=1.5", "tzdata>=2024.1"]
dev = ["pytest>=7", "flask>=3.0", "segno>=1.5", "tzdata>=2024.1"]

[project.scripts]
exbuilder = "exbuilder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
exbuilder = ["web/templates/*.html", "web/templates/*/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
