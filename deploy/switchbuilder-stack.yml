# Docker Swarm stack for the Multi-Vendor Switch Config Builder web UI.
# Deploy in Portainer (Stacks > Add stack > Web editor) or with:
#   docker stack deploy -c deploy/switchbuilder-stack.yml --with-registry-auth switchbuilder
#
# First sign-in: admin / admin. The app makes you choose a new password
# right away. See INSTALL.md.
#
# Users live in the switchbuilder_data volume. It's a local volume, so the service
# is pinned to one node: set EXB_NODE to that node's hostname.
version: "3.8"

services:
  web:
    image: ghcr.io/cyberpunkspacex/switch-config-builder:latest
    environment:
      # Set to "true" once users only reach the UI over HTTPS.
      EXB_SECURE_COOKIES: ${EXB_SECURE_COOKIES:-false}
      EXB_REQUIRE_2FA: ${EXB_REQUIRE_2FA:-false}
      EXB_REQUIRE_2FA_ADMINS: ${EXB_REQUIRE_2FA_ADMINS:-true}
      # Fetch configs from switches over SSH (Network map tab). Each client sets
      # its own switch networks and SSH key on its client page. These are only
      # server-wide limits:
      # - EXB_SSH_ALLOW: networks any client may use (empty = the private ranges
      #   10/8, 172.16/12, 192.168/16, 100.64/10, fc00::/7).
      # - EXB_SSH_DISABLE: "true" turns SSH fetch off for everyone.
      EXB_SSH_ALLOW: ${EXB_SSH_ALLOW:-}
      EXB_SSH_DISABLE: ${EXB_SSH_DISABLE:-false}
      # Client SSH keys are stored encrypted with a master key. Without this it is
      # made in /data/master_key, next to the database (and in its backups). Better:
      #   head -c 32 /dev/urandom | base64 | docker secret create switchbuilder_master_key -
      # then uncomment this and the secrets parts below.
      # EXB_MASTER_KEY_FILE: /run/secrets/switchbuilder_master_key
    ports:
      # Published on every node through the swarm routing mesh.
      # The reverse proxy (switchbuilder.cyberpunkx.ca) forwards here.
      - target: 8080
        published: ${EXB_PORT:-8088}
        protocol: tcp
        mode: ingress
    read_only: true
    volumes:
      - switchbuilder_data:/data
      # Swarm ignores the service-level `tmpfs:` key, so mount it this way.
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 67108864  # 64 MB
    deploy:
      replicas: 1
      update_config:
        # stop-first: the SQLite database must not be opened by two tasks at once.
        order: stop-first
        failure_action: rollback
      placement:
        constraints:
          - node.hostname == ${EXB_NODE:?set EXB_NODE to the node that keeps the data volume}
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 256M
      labels:
        app: switchbuilder

    # secrets:
    #   - switchbuilder_master_key

volumes:
  switchbuilder_data:

# secrets:
#   switchbuilder_master_key:
#     external: true
